<div class="container mt-4">
  <h2>Gestión de Productos y Servicios</h2>

  <!-- Formulario -->
  <div class="card p-3 mb-4 shadow-sm">
    <form (submit)="guardarProducto()">
      <div class="row">
        <div class="col-md-4 mb-3">
          <label>Nombre</label>
          <input type="text" class="form-control" [(ngModel)]="selectedProducto.nombre" name="nombre" required>
        </div>
        <div class="col-md-4 mb-3">
          <label>Categoría</label>
          <input type="text" class="form-control" [(ngModel)]="selectedProducto.categoria" name="categoria" required>
        </div>
        <div class="col-md-4 mb-3">
          <label>Precio</label>
          <input type="number" class="form-control" [(ngModel)]="selectedProducto.precio" name="precio" required>
        </div>
      </div>
      <div class="row">
        <div class="col-md-4 mb-3">
          <label>Stock</label>
          <input type="number" class="form-control" [(ngModel)]="selectedProducto.stock" name="stock" required>
        </div>
        <div class="col-md-8 mb-3">
          <label>Descripción</label>
          <input type="text" class="form-control" [(ngModel)]="selectedProducto.descripcion" name="descripcion">
        </div>
      </div>
      <button type="submit" class="btn btn-success me-2">Guardar Producto</button>
      <button type="button" class="btn btn-secondary" (click)="limpiarFormulario()">Cancelar / Limpiar</button>
    </form>
  </div>

  <!-- Tabla de Resultados -->
  <h3>Lista de Productos </h3>
  <table class="table table-striped table-bordered mt-2">
    <thead class="table-dark">
      <tr>
        <th>Nombre</th>
        <th>Categoría</th>
        <th>Precio</th>
        <th>Stock</th>
        <th>Descripción</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let prod of productos">
        <td>{{ prod.nombre }}</td>
        <td>{{ prod.categoria }}</td>
        <td>${{ prod.precio }}</td>
        <td>{{ prod.stock }}</td>
        <td>{{ prod.descripcion }}</td>
        <td>
          <button class="btn btn-primary btn-sm me-2" (click)="editarProducto(prod)">Editar</button>
          <button class="btn btn-danger btn-sm" (click)="eliminarProducto(prod.id)">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
