<div class="row">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-header bg-primary text-white font-weight-bold">Gestión de Usuarios</div>
      <div class="card-body">
        <form (ngSubmit)="saveUsuario()">
          <div class="mb-3">
            <label>Nombre Completo</label>
            <input type="text" class="form-control" [(ngModel)]="selectedUsuario.nombre" name="nombre" required>
          </div>
          <div class="mb-3">
            <label>Correo Electrónico</label>
            <input type="email" class="form-control" [(ngModel)]="selectedUsuario.email" name="email" required>
          </div>
          <div class="mb-3">
            <label>Contraseña</label>
            <input type="password" class="form-control" [(ngModel)]="selectedUsuario.password" name="password" required>
          </div>
          <div class="mb-3">
            <label>Rol</label>
            <select class="form-select" [(ngModel)]="selectedUsuario.rol" name="rol">
              <option value="Administrador">Administrador</option>
              <option value="Empleado">Empleado</option>
              <option value="Cliente">Cliente</option>
            </select>
          </div>
          <button type="submit" class="btn btn-success me-2">Guardar</button>
          <button type="button" class="btn btn-secondary" (click)="resetForm()">Limpiar</button>
        </form>
      </div>
    </div>
  </div>

  <div class="col-md-7">
    <table class="table table-striped border">
      <thead class="table-dark">
        <tr>
          <th>Nombre</th>
          <th>Email</th>
          <th>Rol</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let u of usuarios">
          <td>{{ u.nombre }}</td>
          <td>{{ u.email }}</td>
          <td><span class="badge bg-info text-dark">{{ u.rol }}</span></td>
          <td>
            <button class="btn btn-warning btn-sm me-1" (click)="editUsuario(u)">Editar</button>
            <button class="btn btn-danger btn-sm" (click)="deleteUsuario(u._id)">Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
