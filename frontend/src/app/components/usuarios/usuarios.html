<div class="container mt-4">
  <h2>Gestión de Usuarios</h2>

  <!-- Formulario -->
  <div class="card p-3 mb-4 shadow-sm">
    <form (submit)="guardarUsuario()">
      <div class="row">
        <div class="col-md-4 mb-3">
          <label>Nombre</label>
          <input type="text" class="form-control" [(ngModel)]="selectedUsuario.nombre" name="nombre" required>
        </div>
        <div class="col-md-4 mb-3">
          <label>Correo Electrónico</label>
          <input type="email" class="form-control" [(ngModel)]="selectedUsuario.email" name="email" required>
        </div>
        <div class="col-md-4 mb-3">
          <label>Contraseña <span *ngIf="selectedUsuario.id">(Déjalo en blanco para mantener la actual)</span></label>
          <input type="password" class="form-control" [(ngModel)]="selectedUsuario.password" name="password" [required]="!selectedUsuario.id">
        </div>
      </div>
      <button type="submit" class="btn btn-success me-2">
        {{ selectedUsuario.id ? 'Actualizar Usuario' : 'Guardar Usuario' }}
      </button>
      <button type="button" class="btn btn-secondary" (click)="limpiarFormulario()">Cancelar / Limpiar</button>
    </form>
  </div>

  <!-- Tabla de Resultados -->
  <h3>Lista de Usuarios Registrados</h3>
  <table class="table table-striped table-bordered mt-2">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Email</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let usr of usuarios">
        <td>{{ usr.id }}</td>
        <td>{{ usr.nombre }}</td>
        <td>{{ usr.email }}</td>
        <td>
          <button class="btn btn-primary btn-sm me-2" (click)="editarUsuario(usr)">Editar</button>
          <button class="btn btn-danger btn-sm" (click)="eliminarUsuario(usr.id)">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
